<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon suivi — 250 cases</title>
<style>
:root{--ink:#202b28;--muted:#77817d;--paper:#f5f6f1;--card:#fff;--line:#e5e9e2;--green:#326b55;--lime:#dff0ba}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:40px 22px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{display:flex;align-items:center;gap:11px;font-weight:750}.mark{width:36px;height:36px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:19px}.date{color:var(--muted);font-size:13px}
.hero{display:grid;grid-template-columns:1fr 240px;gap:28px;align-items:center;margin-bottom:25px}.eyebrow{color:var(--green);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:1.5px}.hero h1{font-size:clamp(32px,5vw,46px);line-height:1.1;letter-spacing:-1.7px;margin:8px 0}.hero p{margin:0;color:var(--muted)}
.progress{background:var(--green);color:#fff;border-radius:20px;padding:19px 21px}.progress-head{display:flex;justify-content:space-between;align-items:center;color:#d7e5db;font-size:13px}.percent{font-size:28px;color:white;font-weight:750}.track{height:7px;background:#ffffff35;border-radius:8px;margin:10px 0;overflow:hidden}.fill{height:100%;width:0;background:var(--lime);transition:width .2s}.small{color:#d7e5db;font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 16px 45px #263b2b10}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel h2{font-size:18px;margin:0}.panel-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px}.cell{position:relative}.cell input{position:absolute;opacity:0;width:1px;height:1px}.cell label{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1px solid var(--line);border-radius:11px;background:#fbfcf9;color:#59645d;font-size:13px;font-weight:650;cursor:pointer;transition:.15s;user-select:none}.cell label:hover{border-color:var(--green);background:#f1f6ef}.cell input:checked+label{background:var(--green);border-color:var(--green);color:white}.cell input:checked+label:after{content:"✓";font-size:16px}.cell input:checked+label span{display:none}.cell input:focus-visible+label{outline:3px solid #9dc6a9;outline-offset:2px}.note{text-align:center;color:var(--muted);font-size:12px;margin:17px 0 0}.actions{display:flex;justify-content:flex-end;margin-top:16px}.reset{border:0;background:transparent;color:#758078;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
@media(max-width:650px){main{padding:25px 14px 42px}.hero{grid-template-columns:1fr;gap:17px;margin-bottom:18px}.grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}.panel{padding:16px}.cell label{border-radius:9px;font-size:12px}}
@media(max-width:380px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style></head><body><main>
<header><div class="brand"><div class="mark">✓</div><span>Mon suivi</span></div><div class="date" id="today"></div></header>
<section class="hero"><div><div class="eyebrow">Une seule tâche · 250 étapes</div><h1>Mon suivi</h1><p>Coche une case quand tu avances. Tu peux la décocher à tout moment.</p></div><div class="progress"><div class="progress-head"><span>Ta progression</span><b class="percent" id="percent">0%</b></div><div class="track"><div class="fill" id="fill"></div></div><div class="small" id="summary">0 case cochée sur 250</div></div></section>
<section class="panel"><div class="panel-head"><h2>Cases 1 à 250</h2><span id="checkedCount">0 / 250 cochées</span></div><div class="grid" id="grid" aria-label="250 cases à cocher"></div><p class="note">Ta progression est sauvegardée automatiquement dans ce navigateur.</p><div class="actions"><button type="button" class="reset" id="reset">Tout décocher</button></div></section>
</main><script>
const KEY='mon-suivi-250-v1';let checked=new Set();
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))checked=new Set(saved.filter(n=>Number.isInteger(n)&&n>=1&&n<=250))}catch{}
const fmt=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());document.querySelector('#today').textContent=fmt[0].toLocaleUpperCase('fr-FR')+fmt.slice(1);
const grid=document.querySelector('#grid');
for(let i=1;i<=250;i++){const box=document.createElement('div');box.className='cell';const input=document.createElement('input');input.type='checkbox';input.id='case-'+i;input.checked=checked.has(i);const label=document.createElement('label');label.htmlFor=input.id;const num=document.createElement('span');num.textContent=i;label.append(num);input.addEventListener('change',()=>{input.checked?checked.add(i):checked.delete(i);localStorage.setItem(KEY,JSON.stringify([...checked]));update()});box.append(input,label);grid.append(box)}
function update(){const n=checked.size,p=Math.round(n/250*100);document.querySelector('#percent').textContent=p+'%';document.querySelector('#fill').style.width=p+'%';document.querySelector('#summary').textContent=n+' case'+(n===1?' cochée':'s cochées')+' sur 250';document.querySelector('#checkedCount').textContent=n+' / 250 cochées'}
document.querySelector('#reset').addEventListener('click',()=>{checked.clear();grid.querySelectorAll('input').forEach(input=>input.checked=false);localStorage.setItem(KEY,'[]');update()});update();
</script></body></html>
